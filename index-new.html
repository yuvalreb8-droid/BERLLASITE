<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BERLLA — דפי נחיתה שממירים</title>

  <!-- Preconnect: fonts + WebGL SDK so resources start downloading immediately. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Google Fonts — Hebrew + Latin in one request. Same family list as the
       legacy build so visual rhythm is preserved when sections are ported. -->
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@500;700&family=Bowlby+One&family=Frank+Ruhl+Libre:wght@400;500;700&family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&family=Heebo:wght@300;400;500;600;700;800;900&family=Miriam+Libre:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       BERLLA — mobile-first foundation
       Designed at 375px first. clamp() lets every value scale up
       to 2560px without media queries. Add @media ONLY when the
       layout visibly breaks at a specific width — never preemptively.
       ============================================================ */

    /* ===== Design tokens =====
       Floors  = 375px (mobile) values.
       Caps    = ~2560px values.
       Body text floor: 16px (WCAG; also prevents iOS auto-zoom on inputs).
       Touch targets:   44px (WCAG 2.5.5, iOS HIG, IS 5568). */
    :root {
      /* --- Color palette --- */
      --color-bg:           #F4F0EB;   /* warm cream — primary section bg */
      --color-bg-alt:       #EFEAE3;   /* alternating panels (process) */
      --color-text:         #0E1629;   /* deep navy — body text */
      --color-text-on-dark: #F4F0EB;   /* cream over navy/burgundy */
      --color-accent:       #8B2E4A;   /* burgundy — link hover, focus, eyebrows */
      --color-dark:         #0E1629;   /* deep navy — buttons, footer bg */
      --color-hero-1:       #7a2440;   /* hero radial: outer */
      --color-hero-2:       #3a0f1d;   /* hero radial: mid */
      --color-hero-3:       #120408;   /* hero radial: center */
      --color-portfolio-1:  #e8e4df;   /* portfolio placeholder gradient start */
      --color-portfolio-2:  #d4d0ca;   /* portfolio placeholder gradient end */
      --color-overlay:      rgba(14, 22, 41, 0.55);

      /* --- Spacing scale (8pt base) ---
         For component-internal spacing. Section-level uses --space-section-*. */
      --space-1: 0.25rem;   /*  4px */
      --space-2: 0.5rem;    /*  8px */
      --space-3: 0.75rem;   /* 12px */
      --space-4: 1rem;      /* 16px */
      --space-5: 1.5rem;    /* 24px */
      --space-6: 2rem;      /* 32px */
      --space-7: 3rem;      /* 48px */
      --space-8: 4rem;      /* 64px */

      /* --- Section padding (fluid) ---
         Vertical:    48px on mobile → 144px on huge screens.
         Horizontal:  20px floor protects mobile edges; 64px cap stops content
                      kissing the viewport on 4K displays. */
      --space-section-y: clamp(3rem, 5vw + 1.25rem, 9rem);
      --space-section-x: clamp(1.25rem, 4vw, 4rem);

      /* --- Container ---
         Max-width 1600px. Mobile uses padding-inline instead of constraining width. */
      --container-max: 100rem;

      /* --- Type scale (mobile-first floors at 16px+) ---
         Body floor never drops below 16px (WCAG + iOS auto-zoom guard).
         Caps reached around 1920–2560px. */
      --text-xs:      clamp(0.75rem,  0.7rem  + 0.2vw, 0.875rem);    /* 12 → 14, captions/meta */
      --text-sm:      clamp(0.875rem, 0.825rem + 0.2vw, 1rem);       /* 14 → 16 */
      --text-base:    clamp(1rem,     0.95rem + 0.2vw, 1.125rem);    /* 16 → 18, body */
      --text-lg:      clamp(1.125rem, 1.05rem + 0.4vw, 1.375rem);    /* 18 → 22 */
      --text-xl:      clamp(1.375rem, 1.2rem  + 0.8vw, 1.875rem);    /* 22 → 30 */
      --text-2xl:     clamp(1.75rem,  1.4rem  + 1.5vw, 2.5rem);      /* 28 → 40 */
      --text-3xl:     clamp(2.25rem,  1.6rem  + 3vw,   3.5rem);      /* 36 → 56 */
      --text-4xl:     clamp(2.75rem,  1.8rem  + 5vw,   5rem);        /* 44 → 80 */
      --text-display: clamp(3.6rem,   2rem    + 12vw,  16rem);       /* 57.6 → 256 — hero brand only */

      /* --- Line heights --- */
      --lh-tight: 1.1;
      --lh-snug:  1.3;
      --lh-base:  1.6;

      /* --- Font families --- */
      --font-body:    'Heebo', system-ui, -apple-system, sans-serif;
      --font-heading: 'Fraunces', 'Heebo', serif;
      --font-display: 'Bowlby One', 'Fraunces', serif;
      --font-ui:      'Assistant', 'Heebo', system-ui, sans-serif;

      /* --- Touch targets ---
         WCAG 2.5.5 + iOS HIG: 44×44 CSS px minimum hit area. */
      --target-min: 44px;

      /* --- Border radii --- */
      --radius-sm:   0.5rem;
      --radius-md:   1rem;
      --radius-lg:   2rem;
      --radius-pill: 999px;

      /* --- Motion ---
         --ease matches GSAP "quart.out" so CSS transitions feel like the JS animations. */
      --ease:     cubic-bezier(0.22, 1, 0.36, 1);
      --dur-fast: 200ms;
      --dur-base: 400ms;
      --dur-slow: 800ms;

      /* --- Z-index scale (gaps left for inserts) --- */
      --z-base:    0;
      --z-section: 1;     /* sections AFTER hero need this — WebGL stacking constraint */
      --z-nav:     50;
      --z-cursor:  60;
      --z-modal:   100;
    }

    /* ===== Modern reset ===== */
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html:focus-within { scroll-behavior: smooth; }
    body {
      min-height: 100svh;            /* dynamic viewport unit — survives iOS URL bar */
      line-height: var(--lh-base);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    img, picture, svg, video, canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    input, button, textarea, select { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    a       { color: inherit; text-decoration: none; }
    h1, h2, h3, h4, h5, h6 {
      font-weight: 700;
      line-height: var(--lh-tight);
      letter-spacing: -0.01em;
    }
    ul, ol { list-style: none; }

    /* ===== Body baseline ===== */
    body {
      font-family: var(--font-body);
      font-size:   var(--text-base);
      color:       var(--color-text);
      background:  var(--color-bg);
    }

    /* ===== Selection ===== */
    ::selection {
      background: var(--color-accent);
      color:      var(--color-text-on-dark);
    }

    /* ===== Focus =====
       Keyboard-only focus ring (never on mouse click). WCAG 2.4.7 — non-negotiable. */
    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    /* ===== Skip link — first focusable element ===== */
    .skip-link {
      position: absolute;
      top: 0;
      right: 0;                                       /* RTL — anchor to top-right */
      padding: var(--space-3) var(--space-5);
      background: var(--color-dark);
      color: var(--color-text-on-dark);
      font-weight: 700;
      z-index: var(--z-modal);
      transform: translateY(-100%);
      transition: transform var(--dur-fast) var(--ease);
    }
    .skip-link:focus-visible { transform: translateY(0); }

    /* ===== Container ===== */
    .container {
      width: 100%;
      max-width: var(--container-max);
      margin-inline: auto;
      padding-inline: var(--space-section-x);
    }

    /* ===== Touch target enforcement =====
         Standalone interactives get 44×44 CSS px minimum.
         Inline links inside body text are exempt (see below). */
    a, button, [role="button"], input[type="checkbox"], input[type="radio"], summary {
      min-height: var(--target-min);
      min-width:  var(--target-min);
    }
    p a, li a, blockquote a, .skip-link {
      min-height: 0;
      min-width:  0;
    }

    /* ===== Reduced motion =====
         WCAG 2.3.3 + IS 5568. Kill non-essential animation/parallax for users
         who opt out. Transforms are kept (so layout-positioned elements stay put)
         but their animation/transition durations collapse to ~0. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ============================================================
       Section 1 — HERO
       ------------------------------------------------------------
       Layout strategy:
         Mobile (default, 375–767px): vertical flex stack, content
           grounded at the bottom of the viewport. Tagline above brand.
         Desktop (≥48em / 768px): diagonal anchors — tagline absolute
           top-right, brand absolute bottom-left. Matches legacy visual.

       WebGL constraints (see feedback_berlla_hero_scene_plan_b.md):
         - .hero-scene is position:fixed so it persists across hero's
           full vertical extent without re-painting on scroll.
         - .hero AND any ancestor must NOT use transform/filter/
           perspective/will-change (those break position:fixed).
         - DPR is clamped to 1 BEFORE the SDK loads (see scripts).
       ============================================================ */
    .hero {
      position: relative;
      width: 100%;
      height: 100svh;                 /* dynamic viewport — survives iOS URL bar collapse */
      min-height: 36rem;              /* 576px floor — guards landscape iPhone */
      overflow: hidden;                /* clips Unicorn Studio "Made with" watermark */
      color: var(--color-text-on-dark);
      background:
        radial-gradient(
          ellipse at center,
          var(--color-hero-1) 0%,
          var(--color-hero-2) 55%,
          var(--color-hero-3) 100%
        );
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: var(--space-section-x);
      padding-block-end: var(--space-7);
      cursor: none;                    /* desktop: hidden by .hero-cursor; touch overrides below */
    }
    /* Touch devices have no GSAP cursor — restore native cursor so taps still feel right */
    @media (hover: none) {
      .hero { cursor: auto; }
    }

    /* WebGL canvas container. Fixed positioning is essential — see notes above. */
    .hero-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--dur-slow) var(--ease);
    }
    .hero-scene.is-loaded { opacity: 1; }

    /* Stretch the SDK's canvas slightly so its bottom-right watermark sits below
       hero's overflow:hidden cutoff. See feedback_unicorn_studio_patterns.md. */
    .hero-scene > canvas {
      width:  100% !important;
      height: 110% !important;
    }
    /* Belt-and-braces: hide the watermark element directly if SDK exposes it */
    a[href*="unicorn.studio"],
    a[href*="unicornstudio"],
    [class*="unicornStudio-badge"] {
      display: none !important;
    }

    /* Soft vignette over scene for legibility of overlaid text */
    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 60%, transparent 30%, rgba(0, 0, 0, 0.35) 100%);
    }

    /* Tagline block (mobile-first): full-width-ish, reads above the brand */
    .hero-desc {
      position: relative;
      z-index: 2;
      font-family: var(--font-ui);
      font-size: var(--text-base);
      line-height: var(--lh-base);
      font-weight: 500;
      max-width: 32rem;
      margin-block-end: var(--space-5);
      color: var(--color-text-on-dark);
    }
    .hero-desc strong {
      display: block;
      font-family: var(--font-body);
      font-size: var(--text-xl);
      font-weight: 800;
      line-height: var(--lh-tight);
      margin-block-end: var(--space-3);
      color: var(--color-text-on-dark);
    }

    /* Brand mark — Bowlby One, oversized, anchors the composition */
    .hero-brand {
      position: relative;
      z-index: 2;
      font-family: var(--font-display);
      font-weight: 400;                /* Bowlby One ships as a single weight */
      font-size: var(--text-display);
      line-height: 0.85;
      letter-spacing: -0.04em;
      color: var(--color-text-on-dark);
    }

    /* Custom hero cursor — desktop pointer devices only.
       GSAP positions it after first mousemove; initial scale(0) keeps it invisible.
       Hidden when reduced-motion or no hover capability. */
    .hero-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 1.5rem;
      height: 1.5rem;
      background: var(--color-text-on-dark);
      border-radius: var(--radius-pill);
      pointer-events: none;
      z-index: var(--z-cursor);
      mix-blend-mode: difference;
      transform: translate3d(-50%, -50%, 0) scale(0);
    }
    @media (hover: none), (prefers-reduced-motion: reduce) {
      .hero-cursor { display: none; }
    }

    /* ----- Hero — desktop layout (≥48em) -----
       The single @media this section needs. Mobile stack feels right up to ~720px;
       past that the screen has room for the legacy diagonal composition. */
    @media (min-width: 48em) {
      .hero {
        display: block;
        padding: 0;
      }
      .hero-desc {
        position: absolute;
        top: var(--space-7);
        right: var(--space-7);
        z-index: 2;
        max-width: min(40rem, 50vw);
        margin-block-end: 0;
      }
      .hero-brand {
        position: absolute;
        bottom: var(--space-4);
        left: var(--space-6);
        z-index: 2;
      }
    }

    /* ============================================================
       SECTIONS PENDING — Step 4, in order:
       ✅ 1. Hero
       ⏳ 2. About       6. FAQ
          3. Process    7. Contact
          4. Portfolio  8. Footer
          5. Testimonials  9. Navbar (last)
       ============================================================ */
  </style>
</head>
<body>
  <a href="#main" class="skip-link">דלג לתוכן הראשי</a>

  <!-- ===== NAV — added last (Step 4 #9) ===== -->

  <main id="main">
    <!-- ===== HERO ===== -->
    <section class="hero" aria-label="מבוא">
      <!-- WebGL scene (Unicorn Studio) — decorative, pointer-events disabled.
           data-us-dpi="1" caps the SDK pixelRatio at 1× regardless of device.
           On Retina/4K this is ~4× fewer pixels per frame — big GPU savings
           with imperceptible visual difference for soft, blurred scenes. -->
      <div class="hero-scene" data-us-project="ZuSNX1OqU0vaLaqRHNZE" data-us-dpi="1" aria-hidden="true"></div>

      <!-- Vignette overlay — keeps overlaid copy legible across any scene state -->
      <div class="hero-overlay" aria-hidden="true"></div>

      <!-- Tagline block (visible top-right on desktop, stacked above brand on mobile) -->
      <div class="hero-desc">
        <strong>מפסלים דפי נחיתה.</strong>
        <p>אל תפקירו את הרושם הראשוני שלכם בידיים של סוכנויות גנריות.<br>אנחנו משלבים אסתטיקה עם פסיכולוגיה צרכנית כדי לגרום לאנשים להפוך ללקוחות.</p>
      </div>

      <!-- Brand wordmark — bottom-left on desktop, base of stack on mobile -->
      <h1 class="hero-brand">BERLLA</h1>
    </section>
  </main>

  <!-- Custom hero cursor element — positioned + scaled by GSAP. Sibling of <main>
       so it isn't constrained by section stacking contexts. -->
  <div class="hero-cursor" aria-hidden="true"></div>

  <!-- ============================================================
       Section 1 — Hero JS
       Order matters: DPR cap MUST run before the SDK loads.
       ============================================================ -->

  <!-- 1. Force devicePixelRatio to 1 BEFORE the Unicorn Studio SDK loads.
          On HiDPI displays, 2× DPR = 4× pixels per frame; clamping cuts GPU
          work to 25% with no visible change for soft/blurred scenes. -->
  <script>
    Object.defineProperty(window, 'devicePixelRatio', {
      value: 1, writable: false, configurable: true
    });
  </script>

  <!-- 2. Unicorn Studio SDK — loads on first paint, auto-inits the .hero-scene
          container via its data-us-project attribute. SDK attaches its own mouse
          listener to the scene, so no extra wiring needed here. -->
  <script>!function(){var u=window.UnicornStudio;if(u&&u.init){if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){u.init()})}else{u.init()}}else{window.UnicornStudio={isInitialized:!1};var i=document.createElement("script");i.src="https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v2.1.9/dist/unicornStudio.umd.js",i.onload=function(){if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){UnicornStudio.init()})}else{UnicornStudio.init()}},(document.head||document.body).appendChild(i)}}();</script>

  <!-- 3. Fade-in handshake — the scene starts at opacity 0 (see CSS). When the
          SDK injects its <canvas> we wait two RAFs (so the GPU has actually
          painted) then add .is-loaded to fade it in. 3s safety timeout. -->
  <script>
    (function fadeHeroSceneInWhenReady() {
      const scene = document.querySelector('.hero-scene');
      if (!scene) return;

      let done = false;
      function markLoaded() {
        if (done) return;
        done = true;
        scene.classList.add('is-loaded');
        observer.disconnect();
        clearTimeout(safety);
      }
      function readyAfterPaint() {
        requestAnimationFrame(() => requestAnimationFrame(markLoaded));
      }

      const observer = new MutationObserver(() => {
        if (scene.querySelector('canvas')) readyAfterPaint();
      });
      observer.observe(scene, { childList: true, subtree: true });

      if (scene.querySelector('canvas')) readyAfterPaint();

      const safety = setTimeout(markLoaded, 3000);
    })();
  </script>

  <!-- 4. Visibility gate — set display:none on the scene once .hero scrolls out
          of view. Scroll listener (not IntersectionObserver) because IO callbacks
          can lag, leaving the WebGL running offscreen for a few frames. -->
  <script>
    (function toggleHeroScene() {
      const hero  = document.querySelector('.hero');
      const scene = document.querySelector('.hero-scene');
      if (!hero || !scene) return;

      function update() {
        const rect = hero.getBoundingClientRect();
        const inView = rect.bottom > 0 && rect.top < window.innerHeight;
        scene.style.display = inView ? '' : 'none';
      }

      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update, { passive: true });
      update();
    })();
  </script>

  <!-- 5. GSAP + ScrollTrigger — used here for the hero cursor only;
          ScrollTrigger lands here so the process section (added later) can use it
          without re-loading the lib. -->
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <!-- 6. Custom hero cursor — desktop pointer devices only, scoped to .hero.
          xTo/yTo are gsap.quickTo lerps that smooth the cursor's follow. -->
  <script>
    (function () {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (matchMedia('(hover: none)').matches) return;
      if (!window.gsap) return;

      const cursor = document.querySelector('.hero-cursor');
      const hero   = document.querySelector('.hero');
      if (!cursor || !hero) return;

      gsap.ticker.lagSmoothing(0);
      gsap.set(cursor, { xPercent: -50, yPercent: -50, scale: 0 });

      const xTo = gsap.quickTo(cursor, "x", { duration: 0.5, ease: "quart.out" });
      const yTo = gsap.quickTo(cursor, "y", { duration: 0.5, ease: "quart.out" });

      hero.addEventListener('mousemove', (e) => {
        xTo(e.clientX);
        yTo(e.clientY);
      });
      hero.addEventListener('mouseenter', () => {
        gsap.to(cursor, { scale: 1, duration: 0.5, ease: "quart.out" });
      });
      hero.addEventListener('mouseleave', () => {
        gsap.to(cursor, { scale: 0, duration: 0.3, ease: "quart.out" });
      });
    })();
  </script>
</body>
</html>
